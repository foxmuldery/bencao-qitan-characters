.sidebar{position:fixed;top:0;left:0;width:190px;height:100vh;background:linear-gradient(180deg,#0d0d1f 0%,#0a0a14 100%);border-right:1px solid rgba(160,180,130,.08);z-index:100;overflow-y:auto;padding-bottom:40px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1200px;margin:0 auto 30px;padding:0 24px}
.card{background:#111524;border:1px solid rgba(160,180,130,.06);border-radius:4px;overflow:hidden;cursor:pointer;transition:all .2s}
.card:hover{border-color:rgba(160,200,120,.15);transform:translateY(-2px)}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.card-info{padding:8px 14px 12px}
.card-name{font-size:12px;color:#d4c8a8;line-height:1.4}
.card .badge{display:inline-block;font-size:9px;background:rgba(160,200,120,.08);color:rgba(160,180,130,.4);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}

.lightbox-nav.prev{left:24px}
.lightbox-nav.next{right:24px}

(function(){

  if(sessionStorage.getItem("_pw_ok")===HASH){document.getElementById("pwOverlay").classList.add("hidden");return}
  async function sha256(m){var e=new TextEncoder().encode(m);var d=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  window.checkPassword=function(){var v=document.getElementById("pwInput").value;sha256(v).then(function(h){if(h===HASH){sessionStorage.setItem("_pw_ok",HASH);document.getElementById("pwOverlay").classList.add("hidden")}else{document.getElementById("pwError").style.display="block";document.getElementById("pwInput").value=""}})}

// ===== Render =====
var root=document.getElementById("content-root");
var nav=document.getElementById("sidebarNav");
nav.innerHTML='<a href="#top">▸ 页面顶部</a>';

cats.forEach(function(c){
  nav.innerHTML+='<div class="nav-major">'+c.name.split('·')[0]+'</div><a href="#'+c.sec+'">'+c.name+'</a>';
  root.insertAdjacentHTML("beforeend",
    '<div class="cat-divider" id="'+c.sec+'"><div class="line"></div><span class="cat-label">'+c.name+'</span><div class="line"></div></div>'+
    '<div class="card-grid" id="grid-'+c.id+'"></div>'
  );
});

items.forEach(function(it){
  var grid=document.getElementById("grid-"+it.cat);
  if(!grid) return;
  var badge=it.bk?'<span class="badge">'+it.bk+'</span>':'';
  grid.insertAdjacentHTML("beforeend",
    '<div class="card" onclick="openLightbox(this.querySelector(\'img\'),\''+it.cat+'\')">'+
      '<img src="'+it.file+'" alt="'+it.name+'" loading="lazy">'+
      '<div class="card-info"><div class="card-name">'+it.name+badge+'</div></div>'+
    '</div>'
  );
});

// ===== Lightbox =====
var curImgs=[],curIdx=0;
function openLightbox(img,gridId){
  var g=document.getElementById("grid-"+gridId);
  if(!g) return;
  curImgs=Array.from(g.querySelectorAll("img")).map(function(i){return i.src});
  curIdx=curImgs.indexOf(img.src);
  if(curIdx<0) curIdx=0;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
  document.getElementById("lightbox").classList.add("active");
}
function navLightbox(dir){
  curIdx=(curIdx+dir+curImgs.length)%curImgs.length;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
}
document.addEventListener("keydown",function(e){
  if(!document.getElementById("lightbox").classList.contains("active"))return;
  if(e.key==="Escape")document.getElementById("lightbox").classList.remove("active");
  if(e.key==="ArrowLeft")navLightbox(-1);
  if(e.key==="ArrowRight")navLightbox(1);
});

// Scroll spy
var nls=document.querySelectorAll(".sidebar-nav a[data-nav]");
var sm={"top":"#top"};
cats.forEach(function(c){sm[c.id]=("#"+c.sec)});
window.addEventListener("scroll",function(){
  var sp=window.scrollY+120,cur="top";
  for(var k in sm){var el=document.querySelector(sm[k]);if(el&&el.offsetTop<=sp)cur=k}
  nls.forEach(function(a){a.classList.toggle("active",a.getAttribute("data-nav")===cur)})
});
nls.forEach(function(a){a.setAttribute("data-nav",a.getAttribute("href").replace("#sec-","").replace("#","top"))});
</script>
