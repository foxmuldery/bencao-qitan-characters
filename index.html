(function(){

  if(sessionStorage.getItem("_pw_ok") === HASH){
    document.getElementById("pwOverlay").classList.add("hidden");
    return;
  }
  async function sha256(m){var e=new TextEncoder().encode(m);var d=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  window.checkPassword = function(){
    var v = document.getElementById("pwInput").value;
    sha256(v).then(function(h){
      if(h === HASH){
        sessionStorage.setItem("_pw_ok", HASH);
        document.getElementById("pwOverlay").classList.add("hidden");
        document.getElementById("pwError").style.display = "none";
      } else {
        document.getElementById("pwError").style.display = "block";
        document.getElementById("pwInput").value = "";
      }
    });
  };
})();

var root = document.getElementById("content-root");
var currentSection = null;
var secIdMap = {
  "chenghua-parking":"sec-chenghua-parking",
  "chenghua-building":"sec-chenghua-building",
  "chenghua-office":"sec-chenghua-office",
  "chenghua-zen":"sec-chenghua-zen",
  "caifeng-out":"sec-caifeng-outside",
  "caifeng-f1":"sec-caifeng-f1",
  "caifeng-f2":"sec-caifeng-f2",
  "caifeng-f3":"sec-caifeng-f3",
  "caifeng-f4":"sec-caifeng-f4",
  "city-home":"sec-city-home",
  "city-hospital":"sec-city-hospital",
  "city-campus":"sec-city-campus",
  "city-street":"sec-city-street",
  "yuanmu":"sec-yuanmu"
};

scenes.forEach(function(s){
  if(s.section !== currentSection){
    currentSection = s.section;
    var sid = secIdMap[s.section] || ("sec-"+s.section);
    root.insertAdjacentHTML("beforeend",
      '<div class="cat-divider" id="'+sid+'"><div class="line"></div><span class="cat-label">'+sectionLabels[s.section]+'</span><div class="line"></div></div>'+
      '<div class="section-title"><div class="line"></div><span class="label">'+sectionLabels[s.section]+'</span><div class="line"></div></div>'+
      '<div class="card-grid" id="grid-'+s.section+'">'
    );
    currentGridId = "grid-"+s.section;
  }
  var badge = s.badge ? '<span class="badge">'+s.badge+'</span>' : '';
  var grid = document.getElementById("grid-"+s.section);
  grid.insertAdjacentHTML("beforeend",
    '<div class="card" onclick="openLightbox(this.querySelector(\'img\'),\''+s.section+'\')">'+
      '<img src="'+s.file+'" alt="'+s.name+'" loading="lazy">'+
      '<div class="card-info"><div class="card-name">'+s.name+badge+'</div><div class="card-desc">'+s.desc+'</div></div>'+
    '</div>'
  );
});

// ===== Lightbox =====
var currentImages = [];
var currentIndex = 0;

function openLightbox(img, groupId){
  var grid = document.getElementById("grid-" + groupId);
  if(!grid) return;
  var imgs = grid.querySelectorAll("img");
  currentImages = Array.from(imgs).map(function(i){return i.src});
  currentIndex = currentImages.indexOf(img.src);
  if(currentIndex < 0) currentIndex = 0;
  showLightbox();
}

function showLightbox(){
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
  document.getElementById("lightbox").classList.add("active");
}

function closeLightbox(e){
  if(e && e.target !== document.getElementById("lightbox") && e.target.tagName !== "IMG") return;
  document.getElementById("lightbox").classList.remove("active");
}

function navLightbox(dir){
  currentIndex = (currentIndex + dir + currentImages.length) % currentImages.length;
  showLightbox();
}

document.addEventListener("keydown", function(e){
  if(!document.getElementById("lightbox").classList.contains("active")) return;
  if(e.key === "Escape") closeLightbox();
  if(e.key === "ArrowLeft") navLightbox(-1);
  if(e.key === "ArrowRight") navLightbox(1);
});

var navLinks = document.querySelectorAll(".sidebar-nav a[data-nav]");
var sectionMap = {
  "top":"#top",
  "parking":"#sec-chenghua-parking",
  "building":"#sec-chenghua-building",
  "office":"#sec-chenghua-office",
  "zen":"#sec-chenghua-zen",
  "caifeng-out":"#sec-caifeng-outside",
  "caifeng-f1":"#sec-caifeng-f1",
  "caifeng-f2":"#sec-caifeng-f2",
  "caifeng-f3":"#sec-caifeng-f3",
  "caifeng-f4":"#sec-caifeng-f4",
  "city-home":"#sec-city-home",
  "city-hosp":"#sec-city-hospital",
  "city-campus":"#sec-city-campus",
  "city-street":"#sec-city-street",
  "yuanmu":"#sec-yuanmu"
};

window.addEventListener("scroll", function(){
  var scrollPos = window.scrollY + 120;
  var current = "top";
  for(var key in sectionMap){
    var el = document.querySelector(sectionMap[key]);
    if(el && el.offsetTop <= scrollPos) current = key;
  }
  navLinks.forEach(function(a){
    a.classList.toggle("active", a.getAttribute("data-nav") === current);
  });
});
</script>
