<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>本草奇探 · 视觉参考</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#0a0a14;color:#ede4d4;font-family:"PingFang SC","Noto Serif SC",serif;line-height:1.6}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a14}
::-webkit-scrollbar-thumb{background:rgba(160,180,130,.25);border-radius:3px}

.pw-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a14;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.pw-overlay.hidden{display:none}
.pw-box{text-align:center;padding:60px 40px;border:1px solid rgba(160,180,130,.1);border-radius:8px;background:rgba(255,255,255,.01);max-width:400px}
.pw-box h2{font-size:28px;color:#c8d8b0;letter-spacing:.15em;margin-bottom:24px;font-weight:400}
.pw-box input{width:100%;padding:12px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(160,180,130,.2);border-radius:4px;color:#ede4d4;font-size:16px;text-align:center;font-family:inherit;outline:none;letter-spacing:.1em}
.pw-box input:focus{border-color:rgba(160,200,120,.4)}
.pw-box .pw-error{color:rgba(220,140,120,.6);font-size:12px;margin-top:12px;display:none}

.sidebar{position:fixed;top:0;left:0;width:180px;height:100vh;background:linear-gradient(180deg,#0d0d1f 0%,#0a0a14 100%);border-right:1px solid rgba(160,180,130,.08);z-index:100;overflow-y:auto;padding-bottom:40px}
.sidebar-logo{padding:28px 16px 20px;text-align:center}
.sidebar-logo .title{font-size:14px;font-weight:700;color:#c8d8b0;letter-spacing:.12em}
.sidebar-logo .sub{font-size:10px;color:rgba(160,180,130,.4);letter-spacing:.1em;margin-top:4px}
.sidebar-nav{padding:0 12px}
.sidebar-nav a{display:block;padding:6px 12px;font-size:12px;color:rgba(200,180,150,.5);text-decoration:none;border-radius:4px;transition:all .2s}
.sidebar-nav a:hover,.sidebar-nav a.active{color:#e0d4b8;background:rgba(160,200,120,.08)}
.sidebar-nav .nav-major{font-size:10px;color:rgba(160,180,130,.35);letter-spacing:.15em;padding:16px 12px 4px;border-top:1px solid rgba(160,180,130,.06);margin-top:4px}

.main{margin-left:180px;min-height:100vh}
.hero{padding:50px 0 30px;text-align:center}
.hero h1{font-size:40px;font-weight:700;color:#c8d8b0;letter-spacing:.18em;text-shadow:0 0 50px rgba(140,180,100,.18)}
.hero .subtitle{font-size:13px;color:rgba(170,190,140,.45);letter-spacing:.2em;margin-top:8px}

.cat-divider{max-width:1200px;margin:40px auto 12px;padding:0 24px;display:flex;align-items:center;gap:14px}
.cat-divider .line{flex:1;height:1px;background:rgba(160,180,130,.06)}
.cat-divider .cat-label{font-size:12px;letter-spacing:.2em;color:rgba(160,180,130,.3);white-space:nowrap}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px;max-width:1200px;margin:0 auto 30px;padding:0 24px}
.card{background:#111524;border:1px solid rgba(160,180,130,.06);border-radius:4px;overflow:hidden;cursor:pointer;transition:all .2s}
.card:hover{border-color:rgba(160,200,120,.15);transform:translateY(-2px)}
.card img{width:100%;display:block;object-fit:cover}
.card-info{padding:8px 14px 12px}
.card-name{font-size:12px;color:#d4c8a8}

.lightbox-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);z-index:9999;align-items:center;justify-content:center}
.lightbox-overlay.active{display:flex}
.lightbox-overlay img{max-width:90vw;max-height:90vh;object-fit:contain}
.lightbox-close{position:fixed;top:20px;right:30px;font-size:30px;color:rgba(200,180,150,.5);cursor:pointer;z-index:10000}
.lightbox-close:hover{color:#e0d4b8}
.lightbox-nav{position:fixed;top:50%;font-size:36px;color:rgba(200,180,150,.3);cursor:pointer;z-index:10000;user-select:none}
.lightbox-nav:hover{color:#e0d4b8}
.lightbox-nav.prev{left:24px}
.lightbox-nav.next{right:24px}

.footer{text-align:center;padding:40px 24px 60px;color:rgba(160,180,130,.25);font-size:11px;letter-spacing:.1em}
</style>
</head>
<body>

<div class="pw-overlay" id="pwOverlay">
  <div class="pw-box">
    <h2>本 草 奇 探</h2>
    <input type="password" id="pwInput" placeholder="请输入访问密码" autofocus onkeydown="if(event.key==='Enter')checkPassword()">
    <div class="pw-error" id="pwError">密码错误，请重试</div>
  </div>
</div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="title">视觉参考</div>
    <div class="sub">本草奇探 · Mood Board</div>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</nav>

<div class="main" id="top">
  <div class="hero">
    <h1>本 草 奇 探</h1>
    <div class="subtitle">视觉参考 · 电影摄影与美术气氛参考</div>
  </div>
  <div id="content-root"></div>
  <div class="footer">本草奇探 · 视觉参考图集 · 5 组共 74 张</div>
</div>

<div class="lightbox-overlay" id="lightbox" onclick="this.classList.remove('active')">
  <span class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</span>
  <span class="lightbox-nav prev" onclick="navLightbox(-1)">‹</span>
  <span class="lightbox-nav next" onclick="navLightbox(1)">›</span>
  <img id="lightboxImg" src="">
</div>

<script>
(function(){
  var HASH="019be397cf10ba2e242d7507db0852b1dcab423c62bd150024ef1333a68136aa";
  if(sessionStorage.getItem("_pw_ok")===HASH){document.getElementById("pwOverlay").classList.add("hidden");return}
  async function sha256(m){var e=new TextEncoder().encode(m);var d=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(d)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
  window.checkPassword=function(){var v=document.getElementById("pwInput").value;sha256(v).then(function(h){if(h===HASH){sessionStorage.setItem("_pw_ok",HASH);document.getElementById("pwOverlay").classList.add("hidden")}else{document.getElementById("pwError").style.display="block";document.getElementById("pwInput").value=""}})}
})();

var cats=[
  {id:"annihilation",name:"🌿 Annihilation 湮灭",desc:"植物异常生长·自然恐怖·色彩饱和",sec:"sec-annihilation"},
  {id:"exmachina",name:"🤖 Ex Machina 机械姬",desc:"极简现代空间·冷峻玻璃与绿植",sec:"sec-exmachina"},
  {id:"burning",name:"🔥 Burning 燃烧",desc:"自然光·暮色·雾气·隐约不安",sec:"sec-burning"},
  {id:"host",name:"🦖 The Host 怪物",desc:"城市地下空间·暗流·水体质感",sec:"sec-host"},
  {id:"music",name:"🎵 What Kinda Music",desc:"专辑视觉·氛围参考",sec:"sec-music"}
];

// Build file lists by scanning actual files
var items=[];
var fileMap={"Annihilation":"annihilation","Ex Machina":"exmachina","Burning":"burning","The Host":"host","What Kinda Music":"music"};

// Populate items from file naming pattern: "N - Source.jpg"
var allFiles=[
  "1 - Annihilation.jpg","2 - Annihilation.jpg","3 - Annihilation.jpg","4 - Annihilation.jpg","5 - Annihilation.jpg",
  "6 - Annihilation.jpg","7 - Annihilation.jpg","8 - Annihilation.jpg","9 - Annihilation.jpg","10 - Annihilation.jpg",
  "11 - Annihilation.jpg","12 - Annihilation.jpg","13 - Annihilation.jpg","14 - Annihilation.jpg","15 - Annihilation.jpg",
  "16 - What Kinda Music.jpg",
  "17 - Ex Machina.jpg","18 - Ex Machina.jpg","19 - Ex Machina.jpg","20 - Ex Machina.jpg","21 - Ex Machina.jpg",
  "22 - Ex Machina.jpg","23 - Ex Machina.jpg","24 - Ex Machina.jpg","25 - Ex Machina.jpg","26 - Ex Machina.jpg",
  "27 - Ex Machina.jpg","28 - Ex Machina.jpg","29 - Ex Machina.jpg","30 - Ex Machina.jpg","31 - Ex Machina.jpg",
  "32 - Ex Machina.jpg","33 - Ex Machina.jpg","34 - Ex Machina.jpg",
  "35 - The Host.jpg","36 - The Host.jpg","37 - The Host.jpg","38 - The Host.jpg","39 - The Host.jpg",
  "40 - The Host.jpg","41 - The Host.jpg","42 - The Host.jpg","43 - The Host.jpg","44 - The Host.jpg",
  "45 - The Host.jpg","46 - The Host.jpg","47 - The Host.jpg","48 - The Host.jpg","49 - The Host.jpg",
  "50 - The Host.jpg","51 - The Host.jpg",
  "52 - Burning.jpg","53 - Burning.jpg","54 - Burning.jpg","55 - Burning.jpg","56 - Burning.jpg",
  "57 - Burning.jpg","58 - Burning.jpg","59 - Burning.jpg","60 - Burning.jpg","61 - Burning.jpg",
  "62 - Burning.jpg","63 - Burning.jpg","64 - Burning.jpg","65 - Burning.jpg","66 - Burning.jpg",
  "67 - Burning.jpg","68 - Burning.jpg","69 - Burning.jpg","70 - Burning.jpg","71 - Burning.jpg",
  "72 - Burning.jpg","73 - Burning.jpg","74 - Burning.jpg"
];

allFiles.forEach(function(f){
  var source=f.split(" - ")[1].replace(".jpg","");
  var cat=fileMap[source]||"other";
  var num=f.split(" - ")[0];
  items.push({file:f,name:"#"+num+" · "+source,cat:cat});
});

// Render
var root=document.getElementById("content-root");
var nav=document.getElementById("sidebarNav");
nav.innerHTML='<a href="#top">▸ 页面顶部</a>';

cats.forEach(function(c){
  nav.innerHTML+='<div class="nav-major">'+c.name.split(' ')[0]+'</div><a href="#'+c.sec+'">'+c.name+'</a>';
  root.insertAdjacentHTML("beforeend",
    '<div class="cat-divider" id="'+c.sec+'"><div class="line"></div><span class="cat-label">'+c.name+'</span><div class="line"></div></div>'+
    '<div class="card-grid" id="grid-'+c.id+'"></div>'
  );
});

items.forEach(function(it){
  var grid=document.getElementById("grid-"+it.cat);
  if(!grid) return;
  grid.insertAdjacentHTML("beforeend",
    '<div class="card" onclick="openLightbox(this.querySelector(\'img\'),\''+it.cat+'\')">'+
      '<img src="'+it.file+'" alt="'+it.name+'" loading="lazy">'+
      '<div class="card-info"><div class="card-name">'+it.name+'</div></div>'+
    '</div>'
  );
});

// Lightbox
var curImgs=[],curIdx=0;
function openLightbox(img,gridId){
  var g=document.getElementById("grid-"+gridId);
  if(!g) return;
  curImgs=Array.from(g.querySelectorAll("img")).map(function(i){return i.src});
  curIdx=curImgs.indexOf(img.src);if(curIdx<0)curIdx=0;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
  document.getElementById("lightbox").classList.add("active");
}
function navLightbox(dir){
  curIdx=(curIdx+dir+curImgs.length)%curImgs.length;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
}
document.addEventListener("keydown",function(e){
  if(!document.getElementById("lightbox").classList.contains("active"))return;
  if(e.key==="Escape")document.getElementById("lightbox").classList.remove("active");
  if(e.key==="ArrowLeft")navLightbox(-1);
  if(e.key==="ArrowRight")navLightbox(1);
});

// Scroll spy
var nls=document.querySelectorAll(".sidebar-nav a[data-nav]");
var sm={"top":"#top"};
cats.forEach(function(c){sm[c.id]=("#"+c.sec)});
window.addEventListener("scroll",function(){
  var sp=window.scrollY+120,cur="top";
  for(var k in sm){var el=document.querySelector(sm[k]);if(el&&el.offsetTop<=sp)cur=k}
  nls.forEach(function(a){a.classList.toggle("active",a.getAttribute("data-nav")===cur)})
});
nls.forEach(function(a){a.setAttribute("data-nav",a.getAttribute("href").replace("#sec-","").replace("#","top"))});
</script>
</body>
</html>
