// ===== Render =====
var root=document.getElementById("content-root");
var nav=document.getElementById("sidebarNav");
nav.innerHTML='<a href="#top">▸ 页面顶部</a>';

cats.forEach(function(c){
  nav.innerHTML+='<div class="nav-major">'+c.name.split('·')[0]+'</div><a href="#'+c.sec+'">'+c.name+'</a>';
  root.insertAdjacentHTML("beforeend",
    '<div class="cat-divider" id="'+c.sec+'"><div class="line"></div><span class="cat-label">'+c.name+'</span><div class="line"></div></div>'+
    '<div class="card-grid" id="grid-'+c.id+'"></div>'
  );
});

items.forEach(function(it){
  var grid=document.getElementById("grid-"+it.cat);
  if(!grid) return;
  var badge=it.bk?'<span class="badge">'+it.bk+'</span>':'';
  grid.insertAdjacentHTML("beforeend",
    '<div class="card" onclick="openLightbox(this.querySelector(\'img\'),\''+it.cat+'\')">'+
      '<img src="'+it.file+'" alt="'+it.name+'" loading="lazy">'+
      '<div class="card-info"><div class="card-name">'+it.name+badge+'</div></div>'+
    '</div>'
  );
});

// ===== Lightbox =====
var curImgs=[],curIdx=0;
function openLightbox(img,gridId){
  var g=document.getElementById("grid-"+gridId);
  if(!g) return;
  curImgs=Array.from(g.querySelectorAll("img")).map(function(i){return i.src});
  curIdx=curImgs.indexOf(img.src);
  if(curIdx<0) curIdx=0;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
  document.getElementById("lightbox").classList.add("active");
}
function navLightbox(dir){
  curIdx=(curIdx+dir+curImgs.length)%curImgs.length;
  document.getElementById("lightboxImg").src=curImgs[curIdx];
}
document.addEventListener("keydown",function(e){
  if(!document.getElementById("lightbox").classList.contains("active"))return;
  if(e.key==="Escape")document.getElementById("lightbox").classList.remove("active");
  if(e.key==="ArrowLeft")navLightbox(-1);
  if(e.key==="ArrowRight")navLightbox(1);
});

// Scroll spy
var nls=document.querySelectorAll(".sidebar-nav a[data-nav]");
var sm={"top":"#top"};
cats.forEach(function(c){sm[c.id]=("#"+c.sec)});
window.addEventListener("scroll",function(){
  var sp=window.scrollY+120,cur="top";
  for(var k in sm){var el=document.querySelector(sm[k]);if(el&&el.offsetTop<=sp)cur=k}
  nls.forEach(function(a){a.classList.toggle("active",a.getAttribute("data-nav")===cur)})
});
nls.forEach(function(a){a.setAttribute("data-nav",a.getAttribute("href").replace("#sec-","").replace("#","top"))});
</script>
